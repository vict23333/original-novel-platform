<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>原创小说读写平台 · 第一周低保真原型</title>
<style>
:root{color-scheme:light;--paper:#fff;--ink:#242424;--muted:#616161;--line:#c6c6c6;--wash:#f3f3f3}
*{box-sizing:border-box}body{margin:0;background:#ededed;color:var(--ink);font:16px/1.65 "Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,a,input,select,textarea{outline-offset:3px}button{padding:8px 14px;border:1px solid #858585;background:#fff;border-radius:3px;cursor:pointer}button:hover{background:#e9e9e9}button.primary,button[aria-current=page]{background:#303030;color:#fff}button:disabled{cursor:not-allowed;opacity:.55}input,select,textarea{width:100%;padding:9px 11px;border:1px solid #999;background:#fff;border-radius:2px}textarea{resize:vertical;min-height:100px}h1{font-size:25px;line-height:1.4;margin:0 0 12px}h2{font-size:19px;margin:0 0 12px}h3{font-size:17px;margin:0 0 8px}p{margin:0 0 12px}a{color:inherit}.muted{color:var(--muted);font-size:14px}.top{background:#fff;border-bottom:1px solid var(--line);padding:22px max(22px,calc((100vw - 1160px)/2));}.top strong{font-size:20px}.top p{margin:4px 0 0}.wrap{max-width:1204px;margin:auto;padding:22px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.notice{padding:9px 14px;border-left:3px solid #555;background:#f9f9f9;margin-bottom:16px;min-height:44px}.screen{background:var(--paper);border:1px solid var(--line);padding:28px;min-height:530px}.eyebrow{font:13px/1.5 Consolas,monospace;color:#666;margin-bottom:6px}.line{height:1px;background:var(--line);margin:20px 0}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.between{justify-content:space-between}.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(250px,1fr);gap:26px}.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.search{display:grid;grid-template-columns:minmax(0,1fr) 170px auto;gap:10px;margin:20px 0}.box{border:1px solid var(--line);padding:18px;margin-bottom:16px}.placeholder{border:1px dashed #aaa;color:#666;padding:20px;background:#fafafa}.cover{display:flex;align-items:center;justify-content:center;width:82px;height:112px;background:#e7e7e7;border:1px solid #aaa;color:#666;flex-shrink:0;font-size:13px}.bookrow{display:flex;gap:18px;align-items:flex-start}.badge{display:inline-block;padding:1px 8px;background:#eee;border:1px solid #c9c9c9;font-size:13px;margin-right:5px}.list{list-style:none;margin:0;padding:0}.list li{padding:13px 0;border-bottom:1px solid #ddd}.list li:last-child{border-bottom:0}.label{display:block;margin-bottom:14px}.label span{display:block;margin-bottom:5px}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap}.toolbar label{max-width:160px}.reading{max-width:800px;margin:24px auto;padding:30px;border:1px solid #ccc;line-height:2.05}.reading p{text-indent:2em;margin-bottom:18px;white-space:pre-wrap;overflow-wrap:anywhere}.paper-white{background:#fff;color:#252525}.paper-warm{background:#f2ebdc;color:#332c22}.paper-dark{background:#272727;color:#eee}.reading h2{text-align:center;color:inherit}.chapter-edit{min-height:230px}.small{font-size:14px}.footer{margin-top:15px;color:#666;font-size:13px}.status{margin-top:8px;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.review{display:grid;grid-template-columns:1fr 1fr;gap:18px}.empty{padding:36px 18px;text-align:center;border:1px dashed #aaa}.bookrow h2{overflow-wrap:anywhere}.pre{white-space:pre-wrap;overflow-wrap:anywhere}.scope{margin:22px 0 0;padding-top:13px;border-top:1px dashed #bbb;color:#555;font-size:13px}
@media(max-width:760px){.wrap{padding:12px}.top{padding:18px}.screen{padding:18px}.two,.three,.review{grid-template-columns:1fr}.search{grid-template-columns:1fr 1fr}.search input{grid-column:1/-1}.reading{padding:18px}.nav button{flex:1 1 125px}.cover{width:64px;height:90px}.toolbar label{max-width:none;flex:1 1 120px}h1{font-size:22px}}
@media print{body{background:#fff}.nav,.notice,#reset{display:none}.screen{border:0;padding:0}.wrap{padding:0}.top{padding:0 0 15px}.box{break-inside:avoid}}
</style>
</head>
<body>
<header class="top"><div class="row between"><strong>原创小说读写平台</strong><span class="badge">W1 · v0.1 · 低保真草图</span></div><p class="muted">六个核心页面 · 所有数据均为演示，AI 为模拟，不连接后端；刷新即重置。</p></header>
<div class="wrap"><nav id="nav" class="nav" aria-label="原型页面"></nav><div id="notice" class="notice small" role="status" aria-live="polite">从发现作品开始，或进入作者编辑走一遍发布流程。角色入口仅用于原型审阅。</div><main id="screen" class="screen"></main><footer class="footer row between"><span>结构与流程供需求讨论，界面样式及业务规则待后续细化。</span><button id="reset" type="button">重置演示</button></footer></div>
<script>
'use strict';
const labels={home:'01 发现作品',detail:'02 小说详情',reader:'03 在线阅读',shelf:'04 我的书架',writer:'05 作者编辑',admin:'06 内容审核'};
const sample={title:'雨巷来信',author:'示例作者',category:'都市',summary:'一封没有寄件人的信，让旧城区的修伞匠重新走进多年前的雨夜。以下章节为原型原创示例文字。',chapters:[{title:'第一章 雨声',body:'雨落在旧街的青石上，门前的铜铃轻轻响了一声。林遥抬起头，看见门缝里躺着一封没有署名的信。\n他放下手里的伞骨，展开信纸。纸上只有一句话：明天黄昏，请来河边。\n街对面的灯亮了。他将信收进抽屉，第一次盼着这场雨早些停下。'},{title:'第二章 河岸',body:'第二天黄昏，河面浮着一层薄雾。林遥沿着石阶走下去，在桥下看见一把熟悉的旧伞。\n伞柄上的刻痕，正是父亲教他修伞时留下的记号。一个陌生人从桥影里走出来，手里还握着另一封信。\n“你终于来了。”那人说。林遥没有回答，只是看着缓缓流动的河水。'}]};
const initialDraft={title:'雾港灯塔',category:'悬疑',summary:'小镇灯塔连续三个夜晚发出陌生信号，一名返乡青年开始寻找信号背后的人。',chapterTitle:'第一章 灯光',body:'凌晨三点，停用了多年的灯塔忽然亮了。陈屿站在窗前，数着远处闪烁的灯光。\n他知道，那不是渔船约定的信号。父亲留下的航海日志里，恰好记录着同样的节奏。'};
let s;
function reset(){s={page:'home',selected:'rain',chapter:0,shelf:new Set(),progress:{},draft:{...initialDraft},saved:{...initialDraft},work:'草稿',chapterState:'草稿',workReason:'',chapterReason:'',off:false,ai:'',aiMode:'continue',query:'',category:'全部',font:18,theme:'white'};render();message('演示已重置；没有任何内容发送到服务器。')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function message(v){document.getElementById('notice').textContent=v}
function publicBook(id){return id==='rain'||(s.work==='通过'&&!s.off)}
function publicChapter(id){return id==='rain'||(publicBook(id)&&s.chapterState==='通过')}
function book(id){return id==='rain'?sample:{title:s.saved.title,author:'示例作者（当前编辑）',category:s.saved.category,summary:s.saved.summary,chapters:[{title:s.saved.chapterTitle,body:s.saved.body}]}}
function act(action,label,primary=false,extra=''){return `<button type="button" data-action="${action}" class="${primary?'primary':''}" ${extra}>${label}</button>`}
function head(id,title,desc){return `<div class="eyebrow">${id}</div><h1>${title}</h1><p class="muted">${desc}</p><div class="line"></div>`}
function nav(page){s.page=page;if(page==='reader'&&publicChapter(s.selected))s.progress[s.selected]=s.chapter;render();window.scrollTo(0,0)}
function card(id){const b=book(id);return `<div class="box bookrow"><div class="cover" aria-hidden="true">封面占位</div><div><h2>${esc(b.title)}</h2><p class="small">${esc(b.author)} · ${esc(b.category)} · 连载中</p><p class="muted">${esc(b.summary)}</p>${act('detail','查看详情',false,`data-id="${id}"`)}</div></div>`}
function home(){const ids=['rain','fog'].filter(id=>publicBook(id)).filter(id=>(s.category==='全部'||book(id).category===s.category)&&book(id).title.includes(s.query));return head('P01 / FR-02','发现你的下一本小说','通过题材或书名找到作品，进入详情后阅读与收藏。')+`<form id="search-form" class="search"><input id="query" aria-label="小说关键词" placeholder="搜索书名，例如：雨巷" value="${esc(s.query)}"><select id="category" aria-label="题材分类">${['全部','都市','悬疑'].map(x=>`<option ${s.category===x?'selected':''}>${x}</option>`).join('')}</select><button class="primary">搜索</button></form><div class="two"><section><h2>作品列表 <span class="muted">${ids.length} 部演示作品</span></h2>${ids.length?ids.map(card).join(''):'<div class="empty">没有符合条件的已公开作品。</div>'}</section><aside><h2>热门榜单</h2><div class="placeholder">榜单区域占位<br>统计口径确定后接入真实数据。</div><div class="line"></div><h2>本次演示</h2><p class="small">《雨巷来信》已公开。《雾港灯塔》需要作者提交与管理员审核后才能展示。</p></aside></div>`}
function unavailable(){return '<div class="empty"><h2>该作品或章节暂不可读</h2><p>可能处于草稿、待审、驳回或下架状态。</p>'+act('home','返回发现作品')+'</div>'}
function detail(){if(!publicBook(s.selected))return head('P02 / FR-02、04、05','小说详情','仅展示允许公开的内容。')+unavailable();const b=book(s.selected);return head('P02 / FR-02、04、05','小说详情','查看作品信息和目录，再决定阅读或收藏。')+`<div class="bookrow"><div class="cover" aria-hidden="true">封面占位</div><div><h2>${esc(b.title)}</h2><p class="small">${esc(b.author)} · ${esc(b.category)} <span class="badge">连载中</span></p><p>${esc(b.summary)}</p><div class="actions">${act('read','开始阅读',true,publicChapter(s.selected)?'':'disabled')}${act('collect',s.shelf.has(s.selected)?'移出书架':'加入书架')}</div></div></div><div class="line"></div><div class="two"><section><h2>章节目录</h2>${publicChapter(s.selected)?`<ul class="list">${b.chapters.map((c,i)=>`<li class="row between"><span>${esc(c.title)}</span>${act('chapter','阅读',false,`data-index="${i}"`)}</li>`).join('')}</ul>`:'<div class="placeholder">作品已公开，章节仍待审核。</div>'}</section><aside><h2>作品评论</h2><div class="placeholder">小说评论 · 点赞 · 回复<br>第一周仅展示区域，互动将在后续原型中细化。</div></aside></div>`}
function reader(){if(!publicChapter(s.selected))return head('P03 / FR-03','在线阅读','章节访问受作品与章节公开状态共同约束。')+unavailable();const b=book(s.selected);const c=b.chapters[s.chapter];return head('P03 / FR-03','在线阅读',`${esc(b.title)} · 演示进度保存到章节，仅在当前打开期间有效。`)+`<div class="toolbar"><label>字号<select id="font">${[16,18,22,26].map(x=>`<option value="${x}" ${s.font===x?'selected':''}>${x} px</option>`).join('')}</select></label><label>阅读背景<select id="theme">${[['white','白色'],['warm','暖纸'],['dark','深色']].map(([v,t])=>`<option value="${v}" ${s.theme===v?'selected':''}>${t}</option>`).join('')}</select></label>${act('collect',s.shelf.has(s.selected)?'移出书架':'加入书架')}${act('detail','返回目录',false,`data-id="${s.selected}"`)}</div><article class="reading paper-${s.theme}" style="font-size:${s.font}px"><h2>${esc(c.title)}</h2>${c.body.split('\n').filter(Boolean).map(t=>`<p>${esc(t)}</p>`).join('')}</article><div class="row between">${act('prev','上一章',false,s.chapter===0?'disabled':'')}<span class="small">进度：第 ${s.chapter+1} / ${b.chapters.length} 章</span>${act('next','下一章',false,s.chapter===b.chapters.length-1?'disabled':'')}</div><p class="scope">章节评论区域将在后续原型中细化。本稿只演示正文、设置和进度。</p>`}
function shelf(){return head('P04 / FR-04','我的书架','查看当前演示账号的收藏，并从上次章节继续。')+(s.shelf.size?[...s.shelf].map(id=>`<div class="box row between"><div><h2>${esc(book(id).title)}</h2><p class="muted">${publicBook(id)?'已收藏':'当前不可公开阅读'} · ${s.progress[id]===undefined?'尚未阅读':`读至第 ${s.progress[id]+1} 章`}</p></div><div class="actions">${act('resume','继续阅读',true,`data-id="${id}"`)}${act('remove','移除',false,`data-id="${id}"`)}</div></div>`).join(''):`<div class="empty"><h2>书架还是空的</h2><p>从作品详情或阅读页加入一本小说。</p>${act('home','去发现作品',true)}</div>`)}
function writer(){return head('P05 / FR-06、07、08','作者编辑','先保存草稿，再提交审核。AI 建议需主动采用，才能进入原稿。')+`<div class="two"><section><h2>作品信息</h2><label class="label"><span>小说名称</span><input id="work-title" data-field="title" value="${esc(s.draft.title)}"></label><label class="label"><span>题材分类</span><select data-field="category"><option ${s.draft.category==='悬疑'?'selected':''}>悬疑</option><option ${s.draft.category==='都市'?'selected':''}>都市</option></select></label><label class="label"><span>作品简介</span><textarea id="summary" data-field="summary">${esc(s.draft.summary)}</textarea></label><div class="actions">${act('save-work','保存作品信息')}${act('submit-work','提交作品审核',false,s.work==='待审'?'disabled':'')}</div><p class="status">作品审核：${s.work}${s.workReason?' · 原因：'+esc(s.workReason):''} ${s.off?' · 已下架':''}</p><div class="line"></div><h2>章节草稿</h2><label class="label"><span>章节标题</span><input id="chapter-title" data-field="chapterTitle" value="${esc(s.draft.chapterTitle)}"></label><label class="label"><span>章节正文</span><textarea id="body" class="chapter-edit" data-field="body">${esc(s.draft.body)}</textarea></label><div class="actions">${act('save-chapter','保存章节草稿')}${act('submit-chapter','提交章节审核',true,s.chapterState==='待审'?'disabled':'')}</div><p class="status">章节审核：${s.chapterState}${s.chapterReason?' · 原因：'+esc(s.chapterReason):''}</p></section><aside><h2>AI 辅助创作</h2><p class="muted">模拟交互，不调用 API，不产生费用。建议内容可二次编辑。</p><div class="actions">${act('ai-continue','续写演示')}${act('ai-polish','润色演示')}</div><label class="label" style="margin-top:16px"><span>建议内容</span><textarea id="ai" style="min-height:220px" placeholder="点击上方按钮查看模拟建议">${esc(s.ai)}</textarea></label>${act('adopt','采用到章节',false,s.ai?'':'disabled')}<p class="muted" style="margin-top:12px">续写采用时追加；润色演示采用时替换全文。正式选区交互待细化。</p><div class="line"></div><h2>流程提示</h2><p class="small">小说和章节分别审核。两者均通过后，读者才可看到章节正文。</p><p class="small">本原型保存已修改的通过内容时会退回草稿；是否保留旧公开版本，后续确认。</p></aside></div>`}
function reviewBox(kind){const work=kind==='work';const status=work?s.work:s.chapterState;return `<section class="box"><h2>${work?'小说作品审核':'章节内容审核'}</h2><p><span class="badge">${status}</span>${esc(work?s.saved.title:s.saved.chapterTitle)}</p><div class="placeholder pre">${esc(work?s.saved.summary:s.saved.body)}</div><label class="label" style="margin-top:12px"><span>驳回原因</span><input id="reason-${kind}" placeholder="驳回时必填" value="${esc(work?s.workReason:s.chapterReason)}"></label><div class="actions">${act('approve','审核通过',true,`data-kind="${kind}" ${status==='待审'?'':'disabled'}`)}${act('reject','驳回修改',false,`data-kind="${kind}" ${status==='待审'?'':'disabled'}`)}</div></section>`}
function admin(){return head('P06 / FR-11','内容审核','查看作者保存并提交的内容。作品和章节分别处理。')+`<div class="review">${reviewBox('work')}${reviewBox('chapter')}</div><div class="box row between"><div><h2>违规作品处理</h2><p class="muted">《${esc(s.saved.title)}》 · ${s.off?'已下架':'未下架'}。下架后阻止普通读者访问。</p></div>${act('offline','下架作品',false,(s.off||s.work!=='通过')?'disabled':'')}</div><p class="scope">账号管理、评论管理和分类标签管理保持在完整范围内，管理页面将在第二周补图。</p>`}
function render(){document.getElementById('nav').innerHTML=Object.entries(labels).map(([id,l])=>`<button type="button" data-nav="${id}" ${s.page===id?'aria-current="page"':''}>${l}</button>`).join('');document.getElementById('screen').innerHTML=({home,detail,reader,shelf,writer,admin}[s.page])();}
function save(kind){const keys=kind==='work'?['title','category','summary']:['chapterTitle','body'];if(keys.some(k=>!s.draft[k].trim())){message('请填写完整后再保存或提交。');return false}if((kind==='work'?s.work:s.chapterState)==='待审'){message('内容正在审核中，请处理当前审核后再保存修改。');return false}const changed=keys.some(k=>s.saved[k]!==s.draft[k]);keys.forEach(k=>s.saved[k]=s.draft[k]);if(changed){if(kind==='work'){s.work='草稿';s.workReason=''}else{s.chapterState='草稿';s.chapterReason=''}}return true}
document.addEventListener('input',e=>{if(e.target.dataset.field)s.draft[e.target.dataset.field]=e.target.value;if(e.target.id==='ai')s.ai=e.target.value});
document.addEventListener('change',e=>{if(e.target.id==='font'){s.font=Number(e.target.value);render()}if(e.target.id==='theme'){s.theme=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='search-form'){e.preventDefault();s.query=document.getElementById('query').value.trim();s.category=document.getElementById('category').value;render();message('已按当前条件筛选演示作品。')}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.id==='reset'){reset();return}if(b.dataset.nav){nav(b.dataset.nav);return}const a=b.dataset.action;if(!a)return;let msg='';
if(a==='home'){nav('home');return}if(a==='detail'){s.selected=b.dataset.id;nav('detail');return}if(a==='read'||a==='chapter'){s.chapter=a==='chapter'?Number(b.dataset.index):0;nav('reader');return}if(a==='prev'||a==='next'){s.chapter+=a==='next'?1:-1;s.progress[s.selected]=s.chapter;render();return}
if(a==='collect'){if(s.shelf.has(s.selected)){s.shelf.delete(s.selected);msg='已从演示书架移除。'}else{s.shelf.add(s.selected);msg='已加入演示书架。'}}
if(a==='remove'){s.shelf.delete(b.dataset.id);msg='已移除收藏。'}if(a==='resume'){s.selected=b.dataset.id;s.chapter=s.progress[s.selected]??0;nav('reader');return}
if(a==='save-work'||a==='save-chapter'||a==='submit-work'||a==='submit-chapter'){const kind=a.endsWith('work')?'work':'chapter';if(!save(kind))return;if(a.startsWith('submit')){if(kind==='work'){s.work='待审';s.workReason=''}else{s.chapterState='待审';s.chapterReason=''}msg='已模拟提交审核，请到内容审核页处理。'}else msg='已保存到本次演示会话，刷新会清除。'}
if(a==='ai-continue'||a==='ai-polish'){if(!s.draft.body.trim()){message('请先输入章节正文。');return}s.aiMode=a==='ai-continue'?'continue':'polish';s.ai=s.aiMode==='continue'?'【模拟续写建议】\n陈屿翻开日志，在最后一页发现了一张折叠的海图。灯塔的位置被铅笔圈了起来，旁边写着一个他从未听过的名字。':'【模拟润色建议】\n'+s.draft.body.trim().replace(/忽然亮了/g,'在浓雾中骤然亮起');msg='已生成固定规则的模拟建议，原稿未改变；真实 API 尚未接入。'}
if(a==='adopt'){if(!s.ai.trim()){message('建议内容为空，原稿保持不变。');return}s.draft.body=s.aiMode==='continue'?s.draft.body+'\n\n'+s.ai:s.ai;s.ai='';msg='建议已采用到编辑区，仍需保存并提交审核。'}
